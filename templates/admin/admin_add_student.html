{% extends "admin/base.html" %}
{% block content %}
<div class="section-header">
  <h1>{{ 'Edit Student' if student else 'Add Student' }}</h1>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('admin.save_student') }}">
      <!-- If editing, user_id present and readonly -->
      <div class="row">
        <div class="form-group col-md-6">
          <label>User ID (unique)</label>
          <input type="text" name="user_id" class="form-control" value="{{ student.user_id if student else '' }}" {{ 'readonly' if student else '' }} required>
        </div>

        <div class="form-group col-md-6">
          <label>Email</label>
          <input type="email" name="email" class="form-control" value="{{ student.email if student else '' }}">
        </div>

        <div class="form-group col-md-6">
          <label>First Name</label>
          <input type="text" name="first_name" class="form-control" value="{{ student.first_name if student else '' }}">
        </div>

        <div class="form-group col-md-6">
          <label>Last Name</label>
          <input type="text" name="last_name" class="form-control" value="{{ student.last_name if student else '' }}">
        </div>

        <div class="form-group col-md-6">
          <label>Location Preference</label>
          <input type="text" name="location_pref" class="form-control" value="{{ student.location_pref if student else '' }}">
        </div>

        <div class="form-group col-md-6">
          <label>Desired Course</label>
          <input type="text" name="desired_course" class="form-control" value="{{ student.desired_course if student else '' }}">
        </div>

        <div class="form-group col-md-3">
          <label>10th %</label>
          <input type="number" step="0.01" name="tenth_percent" class="form-control" value="{{ student.academic_profile.tenth_percent if student and student.academic_profile else '' }}">
        </div>

        <div class="form-group col-md-3">
          <label>12th %</label>
          <input type="number" step="0.01" name="twelfth_percent" class="form-control" value="{{ student.academic_profile.twelfth_percent if student and student.academic_profile else '' }}">
        </div>

        <div class="form-group col-md-3">
          <label>Graduation CGPA</label>
          <input type="number" step="0.01" name="graduation_cgpa" class="form-control" value="{{ student.academic_profile.graduation_cgpa if student and student.academic_profile else '' }}">
        </div>

        <div class="form-group col-md-3">
          <label>Entrance Score</label>
          <input type="text" name="entrance_score" class="form-control" value="{{ student.academic_profile.entrance_score if student and student.academic_profile else '' }}">
        </div>

        <div class="form-group col-md-6">
          <label>Budget</label>
          <input type="number" step="0.01" name="budget" class="form-control" value="{{ student.budget if student else '' }}">
        </div>

        <div class="form-group col-md-6">
          <label>Full Name (optional)</label>
          <input type="text" name="name" class="form-control" value="{{ student.name if student else '' }}">
        </div>
      </div>

      <button type="submit" class="btn btn-primary">{{ 'Update' if student else 'Create' }}</button>
      <a href="{{ url_for('admin.list_students') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
