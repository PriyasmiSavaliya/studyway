{% extends 'admin/base.html' %}

{% block content %}
<div class="container">
    <h2>{% if user %}Edit User{% else %}Create User{% endif %}</h2>

    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name"
                   value="{{ user.name if user }}"
                   required class="form-control">
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email"
                   value="{{ user.email if user }}"
                   required class="form-control">
        </div>

        <div class="form-group">
            <label for="password">Password {% if not user %}*{% else %}(leave blank to keep current){% endif %}</label>
            <input type="password" id="password" name="password"
                   {% if not user %}required{% endif %}
                   class="form-control">
        </div>

        <div class="form-group">
            <label for="role">Role *</label>
            <select id="role" name="role" required class="form-control">
                <option value="">Select Role</option>
                <option value="student" {% if user and user.role == 'student' %}selected{% endif %}>Student</option>
<!--                <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>-->
<!--                <option value="college_admin" {% if user and user.role == 'college_admin' %}selected{% endif %}>College Admin</option>-->
            </select>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone"
                   value="{{ user.phone if user }}"
                   class="form-control">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address"
                      class="form-control">{{ user.address if user }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if user %}Update User{% else %}Create User{% endif %}
            </button>
            <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<style>
.form {
    max-width: 600px;
    margin: 0 auto;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
}

.form-control {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

.form-control:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
}

.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    font-size: 1rem;
}

.btn-primary {
    background-color: #007bff;
    color: white;
}

.btn-secondary {
    background-color: #6c757d;
    color: white;
}

.btn:hover {
    opacity: 0.9;
}
</style>
{% endblock %}
