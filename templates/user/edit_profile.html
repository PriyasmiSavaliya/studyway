{% extends 'base.html' %}

{% block content %}

<!-- Edit Profile Hero Section -->
<section id="edit-profile-hero" class="page-title section dark-background">
  <div class="container">
    <h2 data-aos="fade-up">Edit Profile</h2>
    <p data-aos="fade-up" data-aos-delay="100">Update your personal and academic information</p>
  </div>
</section>

<!-- Edit Profile Section -->
<section id="edit-profile" class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10" data-aos="fade-up" data-aos-delay="100">

        <div class="profile-card">
          <div class="card-header">
            <h3><i class="bi bi-person-gear me-2"></i>Edit Your Profile</h3>
            <p class="text-muted mb-0">Update your personal details and academic information</p>
          </div>

          <div class="card-body">
            <form method="post" class="profile-form">

              <!-- Personal Information -->
              <div class="section-divider">
                <h5><i class="bi bi-person me-2"></i>Personal Information</h5>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" name="first_name"
                           value="{{ user.first_name or '' }}" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" name="last_name"
                           value="{{ user.last_name or '' }}" required>
                  </div>
                </div>
              </div>

              <!-- Academic Information -->
              <div class="section-divider">
                <h5><i class="bi bi-mortarboard me-2"></i>Academic Information</h5>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">10th Percentage (%)</label>
                    <input type="number" step="0.01" min="0" max="100" class="form-control"
                           name="tenth_percent"
                           value="{{ user.academic_profile.tenth_percent if user.academic_profile else '' }}"
                           placeholder="Enter 10th percentage">
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">12th Percentage (%)</label>
                    <input type="number" step="0.01" min="0" max="100" class="form-control"
                           name="twelfth_percent"
                           value="{{ user.academic_profile.twelfth_percent if user.academic_profile else '' }}"
                           placeholder="Enter 12th percentage">
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">Graduation CGPA</label>
                    <input type="number" step="0.01" min="0" max="10" class="form-control"
                           name="graduation_cgpa"
                           value="{{ user.academic_profile.graduation_cgpa if user.academic_profile else '' }}"
                           placeholder="Enter CGPA (0-10)">
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">Entrance Score</label>
                    <input type="number" step="0.01" class="form-control"
                           name="entrance_score"
                           value="{{ user.academic_profile.entrance_score if user.academic_profile else '' }}"
                           placeholder="Enter entrance score">
                  </div>
                </div>
              </div>

              <!-- Preferences -->
              <div class="section-divider">
                <h5><i class="bi bi-heart me-2"></i>Preferences</h5>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">Desired Course</label>
                    <input type="text" class="form-control" name="desired_course"
                           value="{{ user.desired_course or '' }}"
                           placeholder="e.g., B.Tech, MBA, BCA">
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">Preferred Location</label>
                    <input type="text" class="form-control" name="location_pref"
                           value="{{ user.location_pref or '' }}"
                           placeholder="e.g., Delhi, Mumbai, Bangalore">
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group mb-4">
                    <label class="form-label">Budget (₹)</label>
                    <input type="number" step="0.01" class="form-control" name="budget"
                           value="{{ user.budget or '' }}"
                           placeholder="Enter your budget">
                  </div>
                </div>
              </div>

              <!-- Save Button -->
              <div class="form-actions">
  <button type="submit" class="btn btn-primary btn-lg">
    <i class="bi bi-check-circle me-2"></i>Save Changes
  </button>
  <a href="{{ url_for('user.profile') }}" class="btn btn-outline-secondary btn-lg ms-2">
    <i class="bi bi-arrow-left me-2"></i>Back to Profile
  </a>
</div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<style>
.page-title.section {
  padding: 60px 0;
  background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
  color: white;
  text-align: center;
}

.page-title h2 {
  margin-bottom: 10px;
  font-weight: 700;
}

.page-title p {
  font-size: 1.1rem;
  opacity: 0.9;
}

.profile-card {
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.1);
  overflow: hidden;
  border: none;
}

.card-header {
  background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
  color: white;
  padding: 2rem;
}

.card-header h3 {
  margin-bottom: 0.5rem;
  font-weight: 700;
  display: flex;
  align-items: center;
}

.card-body {
  padding: 2rem;
}

.form-label {
  font-weight: 600;
  color: #495057;
  margin-bottom: 0.5rem;
}

.form-control {
  padding: 0.75rem;
  border: 2px solid #e9ecef;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.form-control:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.1);
}

.section-divider {
  border-bottom: 2px solid #e9ecef;
  padding-bottom: 1rem;
  margin: 2rem 0 1.5rem 0;
}

.section-divider h5 {
  color: #495057;
  font-weight: 600;
  display: flex;
  align-items: center;
}

.btn-primary {
  background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
  border: none;
  font-weight: 600;
  padding: 0.75rem 2rem;
  transition: all 0.3s ease;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
}

.btn-outline-secondary {
  border: 2px solid #6c757d;
  color: #6c757d;
  font-weight: 600;
  padding: 0.75rem 2rem;
  transition: all 0.3s ease;
}

.btn-outline-secondary:hover {
  background: #6c757d;
  color: white;
  transform: translateY(-2px);
}

.form-actions {
  text-align: center;
  margin-top: 2rem;
}

@media (max-width: 768px) {
  .profile-card {
    margin: 0 1rem;
  }

  .card-body {
    padding: 1.5rem;
  }

  .card-header {
    padding: 1.5rem;
  }

  .form-actions {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .ms-2 {
    margin-left: 0 !important;
  }
}
</style>

{% endblock %}
